name = "receipts-bots"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
# workers.dev stays ON: with it off, the cron trigger did not fire in testing (2026-10-04). Preview URLs are off.
# The only HTTP route is a banner plus /tick, which needs the secret ADMIN_TOKEN.
workers_dev = true
preview_urls = false

# Persistent logs (free allowance: 200k events/day; we emit roughly 1-3 per run). Without this, runs are only visible in a live `wrangler tail`.
[observability]
enabled = true

[vars]
DEPLOY = "production"
MONAD_RPC = "https://testnet-rpc.monad.xyz"
PERPL_API = "https://testnet.perpl.xyz/api"

# Stateless tick every 5 minutes (minutes 0,5,10...). Capped at 3 tx per tick (see tick.ts). The backup below runs at minutes
# 2,7,12... so the two never fire together (no nonce races) and together tick about every 2.5 min. Reveal windows are ~2 h wide,
# commit windows 20 min, so 5-minute granularity per Worker is plenty; 5x fewer runs also means 5x fewer chances to trip a limit.
# GitHub Actions (started every 5 min by receipts-dispatch) is the primary runner since 2026-10-06; this Worker is a backup and
# runs less often to stay under the Free plan CPU limit (it had a 55 min exceededResources spell at 04:05-04:55 IST on Oct 7).
[triggers]
crons = ["*/15 * * * *"]

[env.staging]
name = "receipts-bots-staging"
workers_dev = false
preview_urls = false
# staging cron OFF after the CPU measurement (set to ["* * * * *"] and TEST_FORCE="1" to re-run it)
[env.staging.triggers]
crons = []
[env.staging.vars]
DEPLOY = "staging"
MONAD_RPC = "https://testnet-rpc.monad.xyz"
PERPL_API = "https://testnet.perpl.xyz/api"
TEST_HORIZON_BASE = "60"
TEST_JITTER_MOD = "10"
TEST_FORCE = "0"

# --- backup: same code under a different Worker name, runs every 5 min. If the primary Worker ever dies (it did once on
# 2026-10-04/05, cause unknown, see docs/bugs.md) this keeps reveals/expiries/settles flowing. The tick is idempotent, so
# an overlapping run is skipped by the estimateGas guard; the worst case is a rare nonce race, not duplicate state.
[env.backup]
name = "receipts-bots-backup"
workers_dev = true
preview_urls = false
[env.backup.triggers]
crons = ["2-59/5 * * * *"]
[env.backup.observability]
enabled = true
[env.backup.vars]
DEPLOY = "production"
MONAD_RPC = "https://testnet-rpc.monad.xyz"
PERPL_API = "https://testnet.perpl.xyz/api"
